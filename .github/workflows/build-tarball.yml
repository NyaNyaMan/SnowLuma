name: Build tarball
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SNOWLUMA_TARGET: linux-x64
        run: pnpm run build:all
      - name: Verify layout
        run: pnpm check:release-layout
      - name: Inspect dist layout
        run: |
          echo "=== dist 根目录 ==="
          ls -la dist | head -20
          echo "=== native 目录 ==="
          ls -la dist/native 2>/dev/null || echo "(没有 native 目录!)"
          echo "=== 关键文件检查 ==="
          for f in dist/index.mjs dist/launcher.sh dist/native/snowluma-linux-x64.node dist/native/snowluma-linux-x64.so dist/native/websocket-linux-x64.node; do
            if [ -f "$f" ]; then echo "OK  $f ($(stat -c%s "$f") 字节)"; else echo "缺失  $f"; fi
          done
      - name: Package
        run: |
          chmod +x dist/launcher.sh
          tar -czf SnowLuma-2.4.2-linux-x64-lite.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: snowluma-tarball
          path: SnowLuma-2.4.2-linux-x64-lite.tar.gz
          if-no-files-found: error
