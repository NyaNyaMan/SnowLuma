name: Build image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Build runtime
        run: |
          pnpm install --frozen-lockfile
          SNOWLUMA_TARGET=linux-x64 pnpm run build:all
          pnpm check:release-layout
      - name: Pack tarball
        run: |
          chmod +x dist/launcher.sh
          tar -czf SnowLuma.Framework.tar.gz -C dist .
      - name: Write Dockerfile
        run: |
          printf '%s\n' \
            'FROM ghcr.io/nyanyaman/snowluma:latest' \
            'COPY SnowLuma.Framework.tar.gz /tmp/' \
            'RUN rm -rf /app/runtime/* \' \
            '    && tar -xzf /tmp/SnowLuma.Framework.tar.gz -C /app/runtime \' \
            '    && rm -f /tmp/SnowLuma.Framework.tar.gz \' \
            '    && chown -R snowluma:snowluma /app/runtime' \
            > Dockerfile.runtime
          cat Dockerfile.runtime
      - name: Build image
        run: docker build -f Dockerfile.runtime -t ghcr.io/nyanyaman/snowluma:2.4.2 .
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/nyanyaman/snowluma:2.4.2
      - name: Push to TCR
        run: |
          echo "${{ secrets.TCR_PASS }}" | docker login ccr.ccs.tencentyun.com -u "${{ secrets.TCR_USER }}" --password-stdin
          docker tag ghcr.io/nyanyaman/snowluma:2.4.2 ccr.ccs.tencentyun.com/nyanya/snowluma:2.4.2
          docker push ccr.ccs.tencentyun.com/nyanya/snowluma:2.4.2
